<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:390px; height:844px; overflow:hidden; background:#000; color:#fff; font-family:'Fira Sans',system-ui,sans-serif; }
  .bar { display:flex; justify-content:space-between; padding:14px 16px 0; font-size:14px; }
  .city { font-weight:300; font-size:120px; line-height:.9; letter-spacing:-.04em; white-space:nowrap; margin:10px 0 0 10px; }
  .when { font-size:14px; padding:6px 16px 14px; color:#cfcfcf; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:0 16px; }
  .t { aspect-ratio:1; padding:12px; display:flex; flex-direction:column; justify-content:space-between; font-size:14px; }
  .t b { font-weight:300; font-size:44px; line-height:1; }
  .t.wide { grid-column:span 2; aspect-ratio:auto; height:150px; }
  .rain { background:#005f86; } .heat { background:#a1004f; } .air { background:#4f7a14; } .river { background:#2a2a2a; }
  .t small { font-size:13px; }
  .pivot { display:flex; gap:18px; padding:16px; font-size:26px; font-weight:300; white-space:nowrap; }
  .pivot span { color:#777; } .pivot span:first-child { color:#fff; }
</style>
</head>
<body>
<div class="bar"><span>ghana cities</span><span>change city</span></div>
<div class="city">accra</div>
<p class="when">sat 10 oct, 18:00 · sample data · not an official warning</p>
<div class="grid">
  <div class="t wide rain"><span>rain tonight · act</span><b>22 mm</b><small>heavy rain likely after 21:00 — check GMet and NADMO</small></div>
  <div class="t heat"><span>feels like</span><b>33°</b></div>
  <div class="t air"><span>air · moderate</span><b>18</b></div>
  <div class="t river"><span>river · watch</span><b>+12%</b></div>
  <div class="t river"><span>map</span><b>→</b></div>
</div>
<div class="pivot"><span>flood &amp; rain</span><span>heat &amp; air</span><span>services</span></div>
</body>
</html>
