<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:390px; height:844px; overflow:hidden; background:#f1f5f9; color:#0f172a; font-family:'Atkinson Hyperlegible',system-ui,sans-serif; }
  header { background:#fff; display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid #e2e8f0; font-size:15px; }
  header b { color:#2563eb; }
  header span:last-child { border:1px solid #cbd5e1; border-radius:8px; padding:6px 10px; }
  .hero { padding:18px 16px 6px; }
  .hero small { color:#64748b; font-size:13px; }
  .hero h1 { font-size:26px; margin-top:4px; }
  .alert { margin:12px 16px; background:#eff6ff; border:1px solid #bfdbfe; border-radius:12px; padding:12px 14px; font-size:14px; }
  .alert b { color:#1d4ed8; display:block; font-size:16px; margin-bottom:2px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:0 16px; }
  .tile { background:#fff; border-radius:12px; padding:14px; box-shadow:0 1px 2px rgba(15,23,42,.06); font-size:13px; color:#64748b; }
  .tile i { display:block; width:28px; height:28px; border-radius:8px; background:#dbeafe; margin-bottom:8px; }
  .tile b { display:block; font-size:22px; color:#0f172a; }
  .tabs { display:flex; gap:6px; margin:16px; }
  .tabs a { flex:1; text-align:center; font-size:13px; padding:9px 2px; border-radius:8px; background:#fff; color:#0f172a; text-decoration:none; }
  .tabs a.on { background:#2563eb; color:#fff; }
  .map { margin:0 16px; height:150px; border-radius:12px; background:#e2e8f0; display:grid; place-items:center; font-size:14px; color:#475569; }
</style>
</head>
<body>
<header><span><b>Ghana Cities</b></span><span>Accra ▾</span></header>
<div class="hero"><small>Saturday 10 Oct, 18:00 · sample data</small><h1>Accra</h1></div>
<div class="alert"><b>Heavy rain likely tonight</b>About 22 mm after 21:00. Not an official warning — check GMet and NADMO.</div>
<div class="grid">
  <div class="tile"><i></i><b>28 °C</b>Feels like 33 °C</div>
  <div class="tile"><i></i><b>18</b>PM2.5 · Moderate</div>
  <div class="tile"><i></i><b>22 mm</b>Rain next 24 h</div>
  <div class="tile"><i></i><b>40</b>Dust µg/m³</div>
</div>
<nav class="tabs"><a class="on" href="#">Rain</a><a href="#">Heat &amp; Air</a><a href="#">Services</a><a href="#">Land</a></nav>
<div class="map">Map · tap to load</div>
</body>
</html>
